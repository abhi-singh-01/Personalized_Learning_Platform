# Render.com Backend Deployment Config
# This file tells Render how to build and start the backend.
# Reference: https://render.com/docs/yaml-spec

services:
  - type: web
    name: learnai-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false  # Vercel URL(s), comma-separated if multiple: https://app.vercel.app,https://preview.vercel.app
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "false"  # Set "true" only if you need any *.vercel.app preview without listing each URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # true = learners see "Test pay (mock)" AND "Pay with Razorpay" (when keys above are set). false = gateway only.
      - key: DUMMY_PAYMENT
        value: "true"
      - key: PLATFORM_FEE_RATE
        value: "0.02"
      - key: PLATFORM_GST_RATE
        value: "0.18"
      - key: PAYOUT_DELAY_DAYS
        value: "5"
      - key: FAILED_PAYMENT_RETENTION_HOURS
        value: "72"
      # Forgot password (learner/educator only) — Brevo HTTPS API recommended on Render
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false  # e.g. PLP <abhijeetsingh03.dev@gmail.com> (must match verified Brevo sender)
      - key: APP_NAME
        value: PLP
      # Default admin (created on every deploy via npm start → seed:admin)
      - key: ADMIN_EMAIL
        value: admin@plp.com
      # Optional: durable uploads (S3 or R2/MinIO). When all are set, course materials upload to the bucket instead of relying on ephemeral disk.
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Optional: custom endpoint (Cloudflare R2, MinIO) and public URL base (CDN or R2 public dev URL)
      - key: AWS_S3_ENDPOINT
        sync: false
      - key: AWS_S3_PUBLIC_URL_BASE
        sync: false
    healthCheckPath: /health
